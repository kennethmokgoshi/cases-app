<!DOCTYPE html>
<html>
<head>
    <title>Logout - Zenowethu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a1628;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(79, 209, 197, 0.2);
            border-top-color: #4fd1c5;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        h1 {
            margin: 0 0 10px;
            font-size: 24px;
        }
        p {
            margin: 0;
            color: #9ca3af;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <h1>Logging Out...</h1>
        <p id="status">Clearing session data...</p>
    </div>

    <script>
        function logout() {
            const status = document.getElementById('status');
            
            try {
                status.textContent = 'Clearing cookies...';
                
                // Clear all cookies
                document.cookie.split(";").forEach(function(c) {
                    document.cookie = c.replace(/^ +/, "")
                        .replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
                });
                
                status.textContent = 'Clearing storage...';
                
                // Clear storage
                localStorage.clear();
                sessionStorage.clear();
                
                status.textContent = 'Done! Redirecting...';
                
                // Redirect
                setTimeout(function() {
                    window.location.href = '/login';
                }, 800);
                
            } catch (error) {
                console.error('Error:', error);
                status.textContent = 'Redirecting...';
                setTimeout(function() {
                    window.location.href = '/login';
                }, 500);
            }
        }
        
        // Run immediately
        logout();
    </script>
</body>
</html>
