packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/cli': true
  esbuild: true
  prisma: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

overrides:
  # One Next.js / next-auth everywhere, including packages that only declare a
  # peer dependency — older copies carry RCE / auth-bypass CVEs (audit 2026-09-26).
  next: 16.3.6
  next-auth: 5.0.0-beta.32
