name: CI/CD

on:
  push:
  pull_request:

jobs:
  # ──────────────────────────────────────────────
  # CI: Lint + Typecheck + Unit Tests
  # Runs on every push and pull_request
  # No secrets required — unit tests use Zod schemas only (no DB, no API keys)
  # ──────────────────────────────────────────────
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.30.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zenowethu/database run db:generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Lint (all apps + packages)
        run: pnpm turbo lint

      - name: Typecheck (all apps + packages)
        run: pnpm turbo typecheck

      - name: Run all tests (all apps + packages)
        run: pnpm turbo test

      # ──────────────────────────────────────────────
      # E2E Tests (Conditional)
      # Only runs when RUN_E2E_TESTS secret is set to 'true'
      # Requires: PostgreSQL database, seeded test data, all env vars configured
      # To enable: Add RUN_E2E_TESTS secret in GitHub repo settings
      # ──────────────────────────────────────────────
      - name: Install Playwright browsers
        if: ${{ secrets.RUN_E2E_TESTS == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: E2E tests (cases app)
        if: ${{ secrets.RUN_E2E_TESTS == 'true' }}
        run: pnpm --filter cases run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'test@example.com' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'TestPassword123!' }}

      - name: E2E tests (insurance app)
        if: ${{ secrets.RUN_E2E_TESTS == 'true' }}
        run: pnpm --filter insurance run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'test@example.com' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'TestPassword123!' }}

      - name: E2E tests (legal app)
        if: ${{ secrets.RUN_E2E_TESTS == 'true' }}
        run: pnpm --filter legal run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'test@example.com' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'TestPassword123!' }}

      - name: E2E tests (forensic-audit app)
        if: ${{ secrets.RUN_E2E_TESTS == 'true' }}
        run: pnpm --filter forensic-audit run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'test@example.com' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'TestPassword123!' }}

      - name: E2E tests (finance app)
        if: ${{ secrets.RUN_E2E_TESTS == 'true' }}
        run: pnpm --filter finance run test:e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://test:test@localhost:5432/test' }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          AUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-secret-min-32-chars-long-for-ci-testing-purposes' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || 'test@example.com' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'TestPassword123!' }}

  # ──────────────────────────────────────────────
  # CD: Deploy to Contabo VPS
  # Runs only on push to main, after CI passes
  # Required GitHub secrets:
  #   VPS_HOST   — server IP address
  #   VPS_USER   — SSH username (e.g. root)
  #   VPS_SSH_KEY — private SSH key contents
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.30.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @zenowethu/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Trigger Dokploy deployments
        run: |
          set -e
          for SERVICE_ID in ${{ secrets.DOKPLOY_CASES_ID }} ${{ secrets.DOKPLOY_INSURANCE_ID }} ${{ secrets.DOKPLOY_LEGAL_ID }} ${{ secrets.DOKPLOY_FORENSIC_ID }} ${{ secrets.DOKPLOY_FINANCE_ID }}; do
            echo "Deploying service: $SERVICE_ID"
            curl -s -X POST "${{ secrets.DOKPLOY_URL }}/api/trpc/application.deploy?batch=1" \
              -H "X-Api-Key: ${{ secrets.DOKPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"0\":{\"json\":{\"applicationId\":\"$SERVICE_ID\"}}}"
            echo ""
          done
