name: CI/CD

on:
  push:
  pull_request:

jobs:
  # ──────────────────────────────────────────────
  # CI: Lint + Typecheck + Unit Tests
  # Runs on every push and pull_request
  # No secrets required — unit tests use Zod schemas only (no DB, no API keys)
  # ──────────────────────────────────────────────
  ci:
    name: Lint, Typecheck & Test
    runs-on: ubuntu-latest

    # PostgreSQL service for E2E tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zenowethu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.30.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @zenowethu/database run db:generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test

      - name: Lint (all apps + packages)
        run: pnpm turbo lint

      - name: Typecheck (all apps + packages)
        run: pnpm turbo typecheck

      - name: Run all tests (all apps + packages)
        run: pnpm turbo test

      # ──────────────────────────────────────────────
      # E2E Tests Setup & Execution
      # PostgreSQL service runs automatically for all CI jobs
      # Database is migrated and seeded before E2E tests run
      # ──────────────────────────────────────────────
      - name: Run database migrations
        run: pnpm --filter @zenowethu/database run db:migrate:deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test

      - name: Seed test database
        run: pnpm --filter cases run seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test
          SEED_PASSWORD: TestPassword123!

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (cases app)
        run: pnpm --filter cases run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test
          NEXTAUTH_URL: http://localhost:3000
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          AUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-placeholder' }}
          E2E_EMAIL: kenneth@zenowethu.co.za
          E2E_PASSWORD: TestPassword123!

      - name: E2E tests (insurance app)
        run: pnpm --filter insurance run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test
          NEXTAUTH_URL: http://localhost:3001
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          AUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-placeholder' }}
          E2E_EMAIL: kenneth@zenowethu.co.za
          E2E_PASSWORD: TestPassword123!

      - name: E2E tests (legal app)
        run: pnpm --filter legal run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test
          NEXTAUTH_URL: http://localhost:3002
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          AUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-placeholder' }}
          E2E_EMAIL: kenneth@zenowethu.co.za
          E2E_PASSWORD: TestPassword123!

      - name: E2E tests (forensic-audit app)
        run: pnpm --filter forensic-audit run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test
          NEXTAUTH_URL: http://localhost:3003
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          AUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-placeholder' }}
          E2E_EMAIL: kenneth@zenowethu.co.za
          E2E_PASSWORD: TestPassword123!

      - name: E2E tests (finance app)
        run: pnpm --filter finance run test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/zenowethu_test
          NEXTAUTH_URL: http://localhost:3004
          NEXTAUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          AUTH_SECRET: test-secret-min-32-chars-long-for-ci-testing-purposes-zenowethu
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-test-key-placeholder' }}
          E2E_EMAIL: kenneth@zenowethu.co.za
          E2E_PASSWORD: TestPassword123!

  # ──────────────────────────────────────────────
  # CD: Deploy to Contabo VPS
  # Runs only on push to main, after CI passes
  # Required GitHub secrets:
  #   VPS_HOST   — server IP address
  #   VPS_USER   — SSH username (e.g. root)
  #   VPS_SSH_KEY — private SSH key contents
  # ──────────────────────────────────────────────
  deploy:
    name: Deploy to VPS
    needs: [ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "10.30.1"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run database migrations
        run: pnpm --filter @zenowethu/database exec prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Trigger Dokploy deployments
        run: |
          set -e
          for SERVICE_ID in ${{ secrets.DOKPLOY_CASES_ID }} ${{ secrets.DOKPLOY_INSURANCE_ID }} ${{ secrets.DOKPLOY_LEGAL_ID }} ${{ secrets.DOKPLOY_FORENSIC_ID }} ${{ secrets.DOKPLOY_FINANCE_ID }}; do
            echo "Deploying service: $SERVICE_ID"
            curl -s -X POST "${{ secrets.DOKPLOY_URL }}/api/trpc/application.deploy?batch=1" \
              -H "X-Api-Key: ${{ secrets.DOKPLOY_TOKEN }}" \
              -H "Content-Type: application/json" \
              -d "{\"0\":{\"json\":{\"applicationId\":\"$SERVICE_ID\"}}}"
            echo ""
          done
